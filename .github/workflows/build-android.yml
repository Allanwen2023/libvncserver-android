name: Build Android VNC Server APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout LibVNCserver
        uses: actions/checkout@v4
        with:
          repository: LibVNC/libvncserver
          ref: master
          path: libvncserver

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cross-compile LibVNCserver for Android (arm64)
        run: |
          cd libvncserver
          mkdir build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DWITH_JPEG=OFF \
            -DWITH_PNG=OFF \
            -DWITH_SDL=OFF \
            -DWITH_GTK=OFF \
            -DWITH_TLS=OFF
          make -j$(nproc)

      - name: Verify native binary
        run: |
          file libvncserver/build-android/examples/server/androidvncserver
          ls -lh libvncserver/build-android/examples/server/androidvncserver

      - name: Strip native binary
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            libvncserver/build-android/examples/server/androidvncserver \
            -o androidvncserver

      - name: Create Android Project and Build APK
        run: |
          PROJECT=VncServerApp
          mkdir -p $PROJECT/app/src/main/java/com/example/vncserver
          mkdir -p $PROJECT/app/src/main/res/values
          mkdir -p $PROJECT/app/src/main/assets

          # Copy native executable to assets (will be extracted at runtime)
          cp androidvncserver $PROJECT/app/src/main/assets/

          # AndroidManifest.xml
          cat > $PROJECT/app/src/main/AndroidManifest.xml << 'XMLEND'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.vncserver"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34"/>
              <application android:label="VNC Server" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEND

          # MainActivity.java - Extract executable and run it
          cat > $PROJECT/app/src/main/java/com/example/vncserver/MainActivity.java << 'JAVAEND'
          package com.example.vncserver;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.view.View;
          import android.util.Log;
          import java.io.*;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {
              private static final String TAG = "VncServer";
              private TextView statusText;
              private EditText portEdit;
              private Process vncProcess;
              private File execFile;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40,40,40,40);
                  
                  TextView title = new TextView(this);
                  title.setText("LibVNC Server (Android)");
                  title.setTextSize(24);
                  layout.addView(title);
                  
                  // Port input
                  LinearLayout portRow = new LinearLayout(this);
                  portRow.setOrientation(LinearLayout.HORIZONTAL);
                  TextView portLabel = new TextView(this);
                  portLabel.setText("Port: ");
                  portRow.addView(portLabel);
                  portEdit = new EditText(this);
                  portEdit.setText("5900");
                  portEdit.setInputType(2); // number
                  portRow.addView(portEdit);
                  layout.addView(portRow);
                  
                  statusText = new TextView(this);
                  statusText.setPadding(0,20,0,0);
                  try {
                      String ip = getLocalIpAddress();
                      statusText.setText("Ready\nIP: " + ip);
                  } catch (Exception e) {
                      statusText.setText("Ready");
                  }
                  layout.addView(statusText);
                  
                  Button startBtn = new Button(this);
                  startBtn.setText("Start VNC Server");
                  startBtn.setOnClickListener(v -> startVnc());
                  layout.addView(startBtn);
                  
                  Button stopBtn = new Button(this);
                  stopBtn.setText("Stop");
                  stopBtn.setOnClickListener(v -> stopVnc());
                  layout.addView(stopBtn);
                  
                  setContentView(layout);
                  
                  // Extract executable on startup
                  new Thread(() -> extractExecutable()).start();
              }
              
              private void extractExecutable() {
                  try {
                      File dir = new File(getFilesDir(), "bin");
                      dir.mkdirs();
                      execFile = new File(dir, "androidvncserver");
                      
                      if (!execFile.exists()) {
                          InputStream is = getAssets().open("androidvncserver");
                          FileOutputStream os = new FileOutputStream(execFile);
                          byte[] buf = new byte[8192];
                          int len;
                          while ((len = is.read(buf)) > 0) os.write(buf, 0, len);
                          os.close();
                          is.close();
                      }
                      
                      // Make executable
                      execFile.setExecutable(true);
                      Log.i(TAG, "Executable extracted: " + execFile.getAbsolutePath());
                      runOnUiThread(() -> statusText.append("\nBinary ready: " + execFile.length() + " bytes"));
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to extract executable", e);
                      runOnUiThread(() -> statusText.setText("Error: " + e.getMessage()));
                  }
              }
              
              private void startVnc() {
                  if (execFile == null || !execFile.exists()) {
                      statusText.setText("Binary not ready, please wait...");
                      return;
                  }
                  
                  try {
                      String port = portEdit.getText().toString();
                      
                      // Run the native executable
                      ProcessBuilder pb = new ProcessBuilder(
                          execFile.getAbsolutePath(),
                          "-p", port
                      );
                      pb.redirectErrorStream(true);
                      vncProcess = pb.start();
                      
                      // Read output in background
                      new Thread(() -> {
                          try {
                              BufferedReader reader = new BufferedReader(
                                  new InputStreamReader(vncProcess.getInputStream()));
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  Log.i(TAG, line);
                                  final String l = line;
                                  runOnUiThread(() -> statusText.append("\n" + l));
                              }
                          } catch (IOException e) {
                              Log.e(TAG, "Error reading output", e);
                          }
                      }).start();
                      
                      String ip = getLocalIpAddress();
                      statusText.setText("VNC Server running\nConnect to " + ip + ":" + port);
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to start VNC server", e);
                      statusText.setText("Error: " + e.getMessage());
                  }
              }
              
              private void stopVnc() {
                  if (vncProcess != null) {
                      vncProcess.destroy();
                      vncProcess = null;
                      statusText.setText("Stopped");
                  }
              }
              
              private String getLocalIpAddress() throws Exception {
                  for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                      for (InetAddress addr : Collections.list(ni.getInetAddresses())) {
                          if (!addr.isLoopbackAddress() && addr instanceof Inet4Address)
                              return addr.getHostAddress();
                      }
                  }
                  return "unknown";
              }
          }
          JAVAEND

          # Build APK with aapt/d8
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          PLATFORM_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          
          echo "=== Building APK ==="
          
          # Compile resources
          $BUILD_TOOLS/aapt package -f \
            -M $PROJECT/app/src/main/AndroidManifest.xml \
            -S $PROJECT/app/src/main/res \
            -A $PROJECT/app/src/main/assets \
            -I $PLATFORM_JAR \
            -F $PROJECT/resources.apk
          
          # Compile Java
          mkdir -p obj
          javac -classpath $PLATFORM_JAR -source 1.8 -target 1.8 \
            -d obj $PROJECT/app/src/main/java/com/example/vncserver/MainActivity.java
          
          # Convert to DEX
          $BUILD_TOOLS/d8 --output $PROJECT \
            --lib $PLATFORM_JAR \
            obj/com/example/vncserver/*.class
          
          # Build APK
          cd $PROJECT
          cp resources.apk vncserver-unsigned.apk
          $BUILD_TOOLS/aapt add vncserver-unsigned.apk classes.dex
          
          # Align & sign
          $BUILD_TOOLS/zipalign -f 4 vncserver-unsigned.apk vncserver-aligned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out vncserver-debug.apk vncserver-aligned.apk
          
          echo "=== APK built ==="
          ls -lh vncserver-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vncserver-android-apk
          path: VncServerApp/vncserver-debug.apk
          retention-days: 30
